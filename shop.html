<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All Products — Luna &amp; Co.</title>
<meta name="description" content="Browse the full Luna &amp; Co. collection of bags, accessories, lifestyle pieces, and gift sets. Prices in Philippine Peso.">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="Shop">

<div id="site-header"></div>

<main>

  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> &nbsp;/&nbsp; Shop</div>
      <h1>Shop the collection</h1>
      <p class="lede">Ten pieces chosen for everyday use — bags, accessories, small lifestyle things, and ready-to-give sets.</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem">
        <h2 style="font-size:1.2rem;font-family:var(--sans);font-weight:600">All products</h2>
        <span id="shop-count" style="font-size:.85rem;color:var(--ink-soft)">10 products</span>
      </div>
      <div class="filters" id="filter-bar"></div>
      <div class="grid-products" id="shop-grid"></div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="band rv" style="padding:2.6rem">
        <h2 style="font-size:1.5rem">Not sure which to pick?</h2>
        <p>Send us a message and we will help you choose — or build a gift set to your budget.</p>
        <div class="hero-cta"><a class="btn btn-blush" href="contact.html">Message Luna &amp; Co.</a></div>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="js/store.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
