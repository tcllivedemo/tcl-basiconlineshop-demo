<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EBE3"/>
      <stop offset="1" stop-color="#EBD5CA"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E4DA"/>
      <stop offset="1" stop-color="#E0C3B5"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6F1"/>
      <stop offset="1" stop-color="#F1E4DB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="640" cy="180" r="190" fill="#FBF3EE" opacity=".75"/>
  <rect x="0" y="700" width="800" height="300" fill="url(#wall)"/>

  <!-- stool / table shadow -->
  <ellipse cx="400" cy="812" rx="230" ry="26" fill="#D9C2B4" opacity=".5"/>

  <!-- main tote -->
  <g>
    <path d="M250 470 q150 -60 300 0 l26 300 q-176 34 -352 0 z" fill="url(#bag)"/>
    <path d="M250 470 q150 -60 300 0" fill="none" stroke="#C9A594" stroke-width="3"/>
    <path d="M310 468 q90 -34 180 0" fill="none" stroke="#C9A594" stroke-width="3"/>
    <path d="M330 466 c0 -70 34 -110 70 -110 c36 0 70 40 70 110" fill="none" stroke="#B98E7C" stroke-width="9" stroke-linecap="round"/>
    <rect x="316" y="640" width="168" height="14" rx="7" fill="#EFD9CD"/>
    <circle cx="400" cy="660" r="9" fill="#C9A24D"/>
  </g>

  <!-- small crossbody -->
  <g transform="translate(520 560)">
    <rect x="0" y="0" width="150" height="120" rx="18" fill="#F0DCD1"/>
    <path d="M0 34 q75 -30 150 0" fill="none" stroke="#C9A594" stroke-width="3"/>
    <path d="M30 6 c20 -70 70 -70 90 0" fill="none" stroke="#B98E7C" stroke-width="7" stroke-linecap="round"/>
    <rect x="60" y="50" width="30" height="10" rx="5" fill="#C9A24D"/>
  </g>

  <!-- candle -->
  <g transform="translate(140 600)">
    <rect x="0" y="0" width="92" height="150" rx="14" fill="#E7C9A8"/>
    <rect x="0" y="0" width="92" height="34" rx="14" fill="#DCB894"/>
    <rect x="42" y="-24" width="4" height="26" fill="#8A6B4F"/>
    <ellipse cx="44" cy="-26" rx="6" ry="10" fill="#F0B678"/>
  </g>

  <!-- lavender sprig -->
  <g transform="translate(660 320) rotate(14)">
    <path d="M0 0 q10 70 4 150" fill="none" stroke="#8FA394" stroke-width="5" stroke-linecap="round"/>
    <circle cx="2" cy="14" r="11" fill="#C3B4C9"/>
    <circle cx="6" cy="40" r="12" fill="#BBA9C4"/>
    <circle cx="8" cy="68" r="11" fill="#C3B4C9"/>
    <circle cx="6" cy="94" r="10" fill="#BBA9C4"/>
  </g>

  <!-- soft light -->
  <rect width="800" height="1000" fill="#FBF8F4" opacity=".06"/>
</svg>
