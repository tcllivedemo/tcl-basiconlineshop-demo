<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1EA"/>
      <stop offset="1" stop-color="#EADACF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#b)"/>
  <rect x="0" y="660" width="800" height="340" fill="#F3E7DE"/>

  <!-- shelves -->
  <rect x="90" y="250" width="620" height="16" rx="8" fill="#E3CFC2"/>
  <rect x="90" y="470" width="620" height="16" rx="8" fill="#E3CFC2"/>

  <!-- items on shelf 1 -->
  <g>
    <rect x="130" y="170" width="82" height="80" rx="10" fill="#EFD9CD"/>
    <rect x="240" y="150" width="66" height="100" rx="10" fill="#E7C9A8"/>
    <circle cx="350" cy="205" r="38" fill="#F4E4DA"/>
    <rect x="420" y="165" width="90" height="85" rx="12" fill="#F0DCD1"/>
    <rect x="540" y="185" width="70" height="65" rx="10" fill="#DCCBBE"/>
  </g>

  <!-- items on shelf 2 -->
  <g>
    <rect x="150" y="390" width="76" height="80" rx="10" fill="#E9D6C9"/>
    <circle cx="290" cy="430" r="40" fill="#EFD9CD"/>
    <rect x="370" y="380" width="84" height="90" rx="12" fill="#F4E4DA"/>
    <rect x="500" y="400" width="72" height="70" rx="10" fill="#E7C9A8"/>
    <rect x="606" y="386" width="60" height="84" rx="10" fill="#DCCBBE"/>
  </g>

  <!-- boxes on floor -->
  <g>
    <rect x="200" y="540" width="180" height="130" rx="12" fill="#E8D3C4"/>
    <rect x="200" y="540" width="180" height="26" rx="12" fill="#DCC0AF"/>
    <path d="M290 540 v130" stroke="#D3B4A2" stroke-width="3"/>
    <rect x="440" y="580" width="150" height="110" rx="12" fill="#F0DCD1"/>
    <path d="M515 580 v110" stroke="#D8B9A8" stroke-width="3"/>
  </g>

  <!-- plant -->
  <g transform="translate(650 470)">
    <path d="M0 100 q-10 -70 0 -110" fill="none" stroke="#8FA394" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-16" cy="30" rx="26" ry="14" fill="#9DB0A2" transform="rotate(-24 -16 30)"/>
    <ellipse cx="18" cy="46" rx="26" ry="14" fill="#8FA394" transform="rotate(22 18 46)"/>
    <rect x="-28" y="100" width="56" height="52" rx="8" fill="#D9BFA9"/>
  </g>

  <rect width="800" height="1000" fill="#FBF8F4" opacity=".07"/>
</svg>
