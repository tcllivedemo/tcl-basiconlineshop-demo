<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs><linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9F3EC"/><stop offset="1" stop-color="#E9DACD"/></linearGradient></defs>
  <rect width="800" height="1000" fill="url(#c3)"/>
  <rect x="0" y="700" width="800" height="300" fill="#F3E8DE"/>
  <rect x="60" y="330" width="680" height="14" rx="7" fill="#E3CFC2"/>

  <!-- candle -->
  <g transform="translate(150 170)">
    <rect x="0" y="0" width="110" height="170" rx="16" fill="#E7C9A8"/>
