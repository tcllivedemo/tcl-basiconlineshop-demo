<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F0E9"/>
      <stop offset="1" stop-color="#E9D8CC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#s2)"/>
  <rect x="0" y="700" width="800" height="300" fill="#F3E7DE"/>

  <!-- roll of ribbon -->
  <g transform="translate(150 380)">
    <circle cx="90" cy="90" r="90" fill="#E9B7A8"/>
    <circle cx="90" cy="90" r="46" fill="#F7F0E9"/>
    <path d="M150 150 q80 60 60 170" fill="none" stroke="#E9B7A8" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- kraft box -->
  <g transform="translate(360 480)">
    <rect x="0" y="0" width="260" height="150" rx="14" fill="#E6D0BE"/>
    <rect x="0" y="0" width="260" height="34" rx="14" fill="#D9BFA9"/>
    <path d="M130 0 v150" stroke="#CBAF99" stroke-width="4"/>
    <path d="M60 34 q70 -60 140 0" fill="none" stroke="#C98D7C" stroke-width="8" stroke-linecap="round"/>
    <path d="M200 34 q-70 -60 -140 0" fill="none" stroke="#E9B7A8" stroke-width="8" stroke-linecap="round"/>
    <rect x="228" y="-52" width="70" height="46" rx="6" fill="#FBF4EF"/>
    <path d="M240 -34 h46 M240 -22 h30" stroke="#C9A594" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- tissue -->
  <g transform="translate(370 452) rotate(-6)">
    <path d="M0 0 q60 -30 120 -10 l-8 40 q-60 -18 -118 8 z" fill="#FBF1EC"/>
  </g>

  <!-- small candle -->
  <g transform="translate(120 660)">
    <rect x="0" y="0" width="80" height="120" rx="12" fill="#E7C9A8"/>
    <rect x="0" y="0" width="80" height="28" rx="12" fill="#DCB894"/>
  </g>

  <rect width="800" height="1000" fill="#FBF8F4" opacity=".06"/>
</svg>
